
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幸福之門倒數計時</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #ffe5ee;
  font-family: "Microsoft JhengHei", sans-serif;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: #ad5279;
  padding: 30px 12px;
}

h1 {
  font-size: 32px;
  margin: 0 0 12px;
  color: #cb668e;
}

.subtitle {
  font-size: 16px;
  margin: 0 0 28px;
  line-height: 1.8;
}

/* 門框 */
.door-frame {
  position: relative;
  width: min(90vw, 410px);
  height: 490px;
  border: 12px solid #e6a1b9;
  border-bottom-width: 15px;
  border-radius: 190px 190px 10px 10px;
  background: #fff9fb;
  box-shadow: 0 16px 35px #d58da85c;
  overflow: hidden;
  perspective: 1000px;
}

/* 門後的祝福 */
.inside {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(#fff2f7, #ffffff);
  padding: 25px;
}

.inside h2 {
  font-size: 30px;
  color: #d46591;
}

.inside p {
  font-size: 17px;
  line-height: 1.8;
}

/* 左右門片 */
.door {
  position: absolute;
  top: 0;
  width: 50%;
  height: 100%;
  background: linear-gradient(
    110deg,
    #f9cbd9,
    #e9a8c0
  );
  border: 2px solid #d98fac;
  transition: transform 2.5s ease;
  z-index: 2;
  backface-visibility: hidden;
}

.left-door {
  left: 0;
  transform-origin: left center;
  border-radius: 180px 0 0 0;
}

.right-door {
  right: 0;
  transform-origin: right center;
  border-radius: 0 180px 0 0;
}

/* 門片上的裝飾線條 */
.panel {
  position: absolute;
  top: 20%;
  bottom: 12%;
  left: 12%;
  width: 76%;
  border: 3px solid #fff2f6;
  border-radius: 85px 85px 9px 9px;
  box-shadow: inset 0 0 0 5px #e9acc1;
}

/* 金色門把 */
.handle {
  position: absolute;
  top: 54%;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #d4a64f;
  border: 2px solid #fff1bb;
  box-shadow: 0 2px 6px #8a596477;
  z-index: 4;
}

.left-door .handle {
  right: 12px;
}

.right-door .handle {
  left: 12px;
}

/* 倒數計時牌 */
.countdown-board {
  position: absolute;
  left: 50%;
  top: 32%;
  transform: translateX(-50%);
  width: 92%;
  background: #fff8fbeF;
  border: 2px solid #efb4ca;
  border-radius: 18px;
  padding: 16px 8px;
  z-index: 5;
  box-shadow: 0 8px 22px #bc789455;
  transition: opacity 0.8s;
}

.board-title {
  font-size: 15px;
  margin-bottom: 13px;
  font-weight: bold;
  color: #ae5679;
}

.countdown {
  display: flex;
  gap: 6px;
  justify-content: center;
}

.time-box {
  flex: 1;
  min-width: 0;
  background: #fce2ec;
  border-radius: 9px;
  padding: 10px 2px;
}

.number {
  font-size: 25px;
  font-weight: bold;
  font-variant-numeric: tabular-nums;
  color: #bd587d;
}

.label {
  font-size: 13px;
  margin-top: 5px;
}

.target {
  margin-top: 14px;
  font-size: 13px;
  color: #b87490;
}

/* 倒數結束，門開啟 */
.door-frame.open .left-door {
  transform: rotateY(-110deg);
}

.door-frame.open .right-door {
  transform: rotateY(110deg);
}

.door-frame.open .countdown-board {
  opacity: 0;
  pointer-events: none;
}

.note {
  margin-top: 24px;
  font-size: 14px;
  color: #b87c93;
}

@media (max-width: 450px) {
  h1 {
    font-size: 27px;
  }

  .door-frame {
    height: 440px;
  }

  .number {
    font-size: 21px;
  }
}
</style>
</head>

<body>

<h1>💕 幸福之門 💕</h1>

<p class="subtitle">
  每一天的等待，都是幸福的累積。<br>
  距離那扇門開啟，還剩下……
</p>

<div class="door-frame" id="doorFrame">

  <!-- 門後畫面 -->
  <div class="inside">
    <h2>✨ 幸福之門開啟 ✨</h2>
    <p>
      期待已久的日子終於到來！<br>
      願所有美好都如期而至。💕
    </p>
  </div>

  <!-- 左門 -->
  <div class="door left-door">
    <div class="panel"></div>
    <div class="handle"></div>
  </div>

  <!-- 右門 -->
  <div class="door right-door">
    <div class="panel"></div>
    <div class="handle"></div>
  </div>

  <!-- 門中央的倒數牌 -->
  <div class="countdown-board">

    <div class="board-title">
      距離幸福之門開啟
    </div>

    <div class="countdown">

      <div class="time-box">
        <div class="number" id="days">0</div>
        <div class="label">天</div>
      </div>

      <div class="time-box">
        <div class="number" id="hours">00</div>
        <div class="label">時</div>
      </div>

      <div class="time-box">
        <div class="number" id="minutes">00</div>
        <div class="label">分</div>
      </div>

      <div class="time-box">
        <div class="number" id="seconds">00</div>
        <div class="label">秒</div>
      </div>

    </div>

    <div class="target">
      2027 / 10 / 31　00:00
    </div>

  </div>
</div>

<p class="note">
  ♡ 每一秒，都離幸福更近一點 ♡
</p>

<script>
// 台灣時間 2027/10/31 00:00
const targetDate = new Date(
  "2027-10-31T00:00:00+08:00"
).getTime();

const doorFrame = document.getElementById("doorFrame");

function updateCountdown() {

  const now = Date.now();
  const distance = targetDate - now;

  if (distance <= 0) {
    document.getElementById("days").textContent = "0";
    document.getElementById("hours").textContent = "00";
    document.getElementById("minutes").textContent = "00";
    document.getElementById("seconds").textContent = "00";

    // 倒數結束，自動開門
    doorFrame.classList.add("open");
    return;
  }

  const totalSeconds = Math.floor(distance / 1000);

  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor(
    (totalSeconds % 86400) / 3600
  );
  const minutes = Math.floor(
    (totalSeconds % 3600) / 60
  );
  const seconds = totalSeconds % 60;

  document.getElementById("days").textContent = days;
  document.getElementById("hours").textContent =
    String(hours).padStart(2, "0");
  document.getElementById("minutes").textContent =
    String(minutes).padStart(2, "0");
  document.getElementById("seconds").textContent =
    String(seconds).padStart(2, "0");
}

// 立即更新
updateCountdown();

// 每秒更新
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
